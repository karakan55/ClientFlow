<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotus Güzellik Merkezi - Randevu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 560px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #555;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #555;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .message {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            display: none;
        }

        .error {
            background: #ffe5e5;
            color: #b00000;
            border: 1px solid #ffb3b3;
        }

        .success-box {
            background: #f0fff4;
            border: 1px solid #9ad5ad;
            padding: 20px;
            border-radius: 12px;
        }

        .success-box h2 {
            color: #36834a;
            margin-top: 0;
        }

        .success-box p {
            margin: 9px 0;
        }

        .new-button {
            background: #555;
        }

        .whatsapp-button {
            background: #25D366;
            margin-top: 12px;
        }

        .whatsapp-button:hover {
            background: #1da851;
        }

        .loading {
            color: #777;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Lotus Güzellik Merkezi</h1>

    <div class="subtitle">
        Randevunuzu kolayca oluşturun
    </div>

    <div id="formArea">

        <form id="appointmentForm">

            <label>Ad Soyad</label>

            <input
                type="text"
                id="name"
                required
            >

            <label>Telefon</label>

            <input
                type="tel"
                id="phone"
                required
            >

            <label>Hizmet</label>

            <select id="service" required>

                <option value="">
                    Hizmet seçiniz
                </option>

                <option value="sac-kesimi">
                    Saç Kesimi
                </option>

                <option value="fon">
                    Fön
                </option>

                <option value="boya">
                    Boya
                </option>

                <option value="manikur">
                    Manikür
                </option>

            </select>

            <label>Personel</label>

            <select id="staff" required>

                <option value="">
                    Personel seçiniz
                </option>

                <option value="silan">
                    Şilan
                </option>

                <option value="serpil">
                    Serpil
                </option>

                <option value="personel-3">
                    Personel 3
                </option>

            </select>

            <label>Tarih</label>

            <input
                type="date"
                id="date"
                required
            >

            <label>Saat</label>

            <select id="time" required disabled>

                <option value="">
                    Önce hizmet, personel ve tarih seçiniz
                </option>

            </select>

            <div
                id="loading"
                class="loading"
            >
                Müsait saatler kontrol ediliyor...
            </div>

            <div
                id="errorMessage"
                class="message error"
            ></div>

            <button type="submit">
                Randevu Oluştur
            </button>

        </form>

    </div>


    <!-- BAŞARI EKRANI -->

    <div
        id="successArea"
        style="display:none;"
    >

        <div class="success-box">

            <h2>
                ✅ Randevunuz Oluşturuldu
            </h2>

            <p>
                <strong>Ad:</strong>
                <span id="successName"></span>
            </p>

            <p>
                <strong>Telefon:</strong>
                <span id="successPhone"></span>
            </p>

            <p>
                <strong>Hizmet:</strong>
                <span id="successService"></span>
            </p>

            <p>
                <strong>Personel:</strong>
                <span id="successStaff"></span>
            </p>

            <p>
                <strong>Tarih:</strong>
                <span id="successDate"></span>
            </p>

            <p>
                <strong>Saat:</strong>
                <span id="successTime"></span>
            </p>


            <!-- WHATSAPP -->

            <button
                class="whatsapp-button"
                onclick="openWhatsApp()"
            >
                WhatsApp'tan İşletmeye Ulaş
            </button>


            <button
                class="new-button"
                onclick="newAppointment()"
            >
                Yeni Randevu Oluştur
            </button>

        </div>

    </div>

</div>


<script>

const form =
    document.getElementById("appointmentForm");

const service =
    document.getElementById("service");

const staff =
    document.getElementById("staff");

const date =
    document.getElementById("date");

const time =
    document.getElementById("time");

const loading =
    document.getElementById("loading");

const errorMessage =
    document.getElementById("errorMessage");


const today =
    new Date().toISOString().split("T")[0];

date.min = today;


// MÜSAİT SAATLERİ GETİR

service.addEventListener(
    "change",
    loadAvailableSlots
);

staff.addEventListener(
    "change",
    loadAvailableSlots
);

date.addEventListener(
    "change",
    loadAvailableSlots
);


async function loadAvailableSlots() {

    errorMessage.style.display = "none";

    time.innerHTML = "";

    time.disabled = true;


    if (
        !service.value ||
        !staff.value ||
        !date.value
    ) {

        const option =
            document.createElement("option");

        option.textContent =
            "Önce hizmet, personel ve tarih seçiniz";

        option.value = "";

        time.appendChild(option);

        return;
    }


    loading.style.display = "block";


    try {

        const response =
            await fetch(
                `/api/available-slots?staff=${encodeURIComponent(staff.value)}&date=${encodeURIComponent(date.value)}&service=${encodeURIComponent(service.value)}`
            );


        const data =
            await response.json();


        loading.style.display = "none";


        if (!data.success) {
            throw new Error(data.message);
        }


        if (data.slots.length === 0) {

            const option =
                document.createElement("option");

            option.value = "";

            option.textContent =
                "Bu gün müsait saat yok";

            time.appendChild(option);

            return;
        }


        const firstOption =
            document.createElement("option");

        firstOption.value = "";

        firstOption.textContent =
            "Saat seçiniz";

        time.appendChild(firstOption);


        data.slots.forEach(slot => {

            const option =
                document.createElement("option");

            option.value =
                slot.time;

            option.textContent =
                `${slot.time} - ${slot.endTime}`;

            time.appendChild(option);

        });


        time.disabled = false;


    } catch (error) {

        loading.style.display = "none";

        errorMessage.textContent =
            error.message ||
            "Müsait saatler alınamadı.";

        errorMessage.style.display =
            "block";
    }
}


// RANDEVU GÖNDER

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        errorMessage.style.display =
            "none";


        const appointment = {

            name:
                document.getElementById("name").value,

            phone:
                document.getElementById("phone").value,

            service:
                service.value,

            staff:
                staff.value,

            date:
                date.value,

            time:
                time.value

        };


        try {

            const response =
                await fetch(
                    "/api/appointments",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                appointment
                            )
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                errorMessage.textContent =
                    data.message ||
                    "Randevu oluşturulamadı.";

                errorMessage.style.display =
                    "block";

                return;
            }


            document.getElementById(
                "successName"
            ).textContent =
                appointment.name;


            document.getElementById(
                "successPhone"
            ).textContent =
                appointment.phone;


            document.getElementById(
                "successService"
            ).textContent =
                getServiceName(
                    appointment.service
                );


            document.getElementById(
                "successStaff"
            ).textContent =
                getStaffName(
                    appointment.staff
                );


            document.getElementById(
                "successDate"
            ).textContent =
                appointment.date;


            document.getElementById(
                "successTime"
            ).textContent =
                appointment.time;


            document.getElementById(
                "formArea"
            ).style.display =
                "none";


            document.getElementById(
                "successArea"
            ).style.display =
                "block";


        } catch (error) {

            errorMessage.textContent =
                "Sunucuya bağlanılamadı.";

            errorMessage.style.display =
                "block";

        }

    }
);


// HİZMET İSMİ

function getServiceName(value) {

    const names = {

        "sac-kesimi":
            "Saç Kesimi",

        "fon":
            "Fön",

        "boya":
            "Boya",

        "manikur":
            "Manikür"

    };

    return names[value] || value;
}


// PERSONEL İSMİ

function getStaffName(value) {

    const names = {

        "silan":
            "Şilan",

        "serpil":
            "Serpil",

        "personel-3":
            "Personel 3"

    };

    return names[value] || value;
}


// WHATSAPP

function openWhatsApp() {

    // TEST NUMARASI
    // Buraya kendi WhatsApp numaranı yazabilirsin.
    // Başında + olmadan ülke koduyla yazılmalı.

    const businessNumber =
        "905555555555";


    const name =
        document.getElementById(
            "successName"
        ).textContent;

    const service =
        document.getElementById(
            "successService"
        ).textContent;

    const staff =
        document.getElementById(
            "successStaff"
        ).textContent;

    const date =
        document.getElementById(
            "successDate"
        ).textContent;

    const time =
        document.getElementById(
            "successTime"
        ).textContent;


    const message =
        `Merhaba, randevu oluşturdum.%0A%0A` +
        `Ad: ${name}%0A` +
        `Hizmet: ${service}%0A` +
        `Personel: ${staff}%0A` +
        `Tarih: ${date}%0A` +
        `Saat: ${time}`;


    const whatsappURL =
        `https://wa.me/${businessNumber}?text=${message}`;


    window.open(
        whatsappURL,
        "_blank"
    );

}


// YENİ RANDEVU

function newAppointment() {

    document.getElementById(
        "successArea"
    ).style.display =
        "none";


    document.getElementById(
        "formArea"
    ).style.display =
        "block";


    form.reset();


    time.innerHTML = "";


    const option =
        document.createElement("option");

    option.value = "";

    option.textContent =
        "Önce hizmet, personel ve tarih seçiniz";

    time.appendChild(option);


    time.disabled = true;
}

</script>

</body>
</html>
